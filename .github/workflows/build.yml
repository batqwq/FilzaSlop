name: Build FilzaSlop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.m"
      - "**.h"
      - "**.c"
      - "Makefile"
      - "control"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

      - name: Install signing tool
        run: brew install ldid

      - name: Build package
        run: |
          make clean
          make package FINALPACKAGE=1 messages=yes

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp packages/*.deb artifacts/
          find .theos -type f -name 'FilzaApplySandboxExt.dylib' -exec cp {} artifacts/ \;
          shasum -a 256 artifacts/* > artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FilzaSlop-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
